<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ihsan — Know Allah by His Names</title>
<meta name="description" content="A thoughtful companion for learning Allah’s beautiful Names, with Qur’an references you can open and read in context.">
<meta name="theme-color" content="#0D1A2B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1A2B; --surface:#14263B; --surface2:#1B3250; --line:#26425F;
  --text:#E8EEF6; --muted:#9FB1C7; --gold:#EBCB8B; --accent:#5CC4B5; --on-accent:#08201C;
  --bad:#F08A7A; --good:#5CC4B5;
  --ui:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ar:'Amiri','Traditional Arabic','Geeza Pro',serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#E8EDF5; --line:#D3DCE9;
    --text:#11202F; --muted:#51647A; --gold:#8A5A12; --accent:#0E7C70; --on-accent:#FFFFFF;
    --bad:#B8402F; --good:#0E7C70;
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.ar{font-family:var(--ar);direction:rtl;line-height:1.35}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:700;font-size:20px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:10px;line-height:1.4;color:var(--muted);margin-top:2px;letter-spacing:.15px;direction:ltr;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
h2{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:10px}

/* Today */
.hero{text-align:center;padding:28px 8px 8px}
.hero .ar{font-size:clamp(76px,26vw,132px);color:var(--gold)}
.hero .tr{font-size:28px;font-weight:700;margin-top:6px}
.hero .en{font-size:18px;color:var(--muted);margin-top:2px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px;margin:22px 0 14px;font-size:17px}
.ref{font-size:14px;color:var(--muted);margin-top:10px}
.ref a,.quran-ref{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(92,196,181,.45);text-underline-offset:3px;font-weight:600}
.ref a:focus-visible,.quran-ref:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.pair{font-size:14px;color:var(--muted);margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--accent);color:var(--on-accent);min-height:48px}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn[aria-pressed=true]{background:var(--surface2);color:var(--accent);border:1px solid var(--accent)}
.btn.block{width:100%}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:22px}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.dua{font-size:14px;color:var(--muted);margin-top:18px;text-align:center}

/* Library */
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--text);font:inherit;margin-bottom:14px}
.search::placeholder{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.item .ar{font-size:34px;color:var(--gold);min-width:92px;text-align:center}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t span{font-size:14px;color:var(--muted)}
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.empty{color:var(--muted);text-align:center;padding:30px 0}

/* Sheet */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;width:100%;margin:0;margin-top:auto}
dialog::backdrop{background:rgba(4,10,18,.6)}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:26px 26px 0 0;max-width:560px;margin:0 auto;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet .x{float:right;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:40px;height:40px}
.sheet .hero{padding-top:6px}

/* Quiz */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
.q-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:14px}
.q-prompt{font-size:19px;font-weight:600;margin-bottom:6px}
.q-big{font-size:64px;color:var(--gold);text-align:center;margin:6px 0 4px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:14px 16px;min-height:52px}
.opt.ar{font-size:30px;text-align:center}
.opt.good{border-color:var(--good)}
.opt.bad{border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.fb{margin-top:16px;font-size:16px}
.fb b.good{color:var(--good)} .fb b.bad{color:var(--bad)}
.score{font-size:56px;font-weight:700;text-align:center;margin:8px 0}
.center{text-align:center}
.muted{color:var(--muted)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:10px 6px;font-size:14px;font-weight:500;color:var(--muted);min-height:48px}
nav.tabs button[aria-selected=true]{color:var(--accent);background:var(--surface2);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Ihsan<small class="tagline">A Journey to Knowing Allah</small></div>
    <div class="chip" id="streakChip" aria-label="Daily streak"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Main">
  <div role="tablist">
    <button role="tab" data-tab="today">Today</button>
    <button role="tab" data-tab="library">All 99</button>
    <button role="tab" data-tab="quiz">Quiz</button>
  </div>
</nav>

<dialog id="sheet" aria-label="Name details"><div class="sheet" id="sheetBody"></div></dialog>

<script>
/* ---------- Data: [arabic, transliteration, meaning, lesson, reference] ---------- */
const H = "Jami at-Tirmidhi 3507 — the appended list is graded Da‘if by Darussalam on Sunnah.com; Imam al-Tirmidhi describes the report as gharīb";
const N = [
["الرحمن","Ar-Rahman","The Most Gracious","His mercy covers everyone in this life, believer or not. Start every day from that.","Quran 1:3"],
["الرحيم","Ar-Raheem","The Most Merciful","His special mercy for those who turn to Him. You never run out of second chances.","Quran 1:3"],
["الملك","Al-Malik","The King","Nothing happens outside His rule, so stop fearing what people can do to you.","Quran 59:23"],
["القدوس","Al-Quddus","The Most Holy","Perfect and free from every flaw. He never needs fixing, and neither does His promise.","Quran 59:23"],
["السلام","As-Salam","The Source of Peace","Real peace comes from Him. When your heart is restless, go back to Him.","Quran 59:23"],
["المؤمن","Al-Mu'min","The Granter of Security","He gives true safety and always keeps His word.","Quran 59:23"],
["المهيمن","Al-Muhaymin","The Guardian","He watches over everything. Nothing slips past Him.","Quran 59:23"],
["العزيز","Al-Aziz","The Almighty","Power that nobody can overcome. Real honor comes from being close to Him.","Quran 59:23"],
["الجبار","Al-Jabbar","The Compeller, The Restorer","He mends broken hearts and broken situations, and nothing resists His will.","Quran 59:23"],
["المتكبر","Al-Mutakabbir","The Supreme in Greatness","Greatness belongs to Him alone. Humility is our place.","Quran 59:23"],
["الخالق","Al-Khaliq","The Creator","He made you on purpose, not by accident.","Quran 59:24"],
["البارئ","Al-Bari","The Originator","He brought everything into being, perfectly balanced and without a flaw.","Quran 59:24"],
["المصور","Al-Musawwir","The Fashioner","He shaped your face and form exactly as He willed. You were designed.","Quran 59:24"],
["الغفار","Al-Ghaffar","The Constant Forgiver","He forgives again and again, however many times you come back.","Quran 20:82"],
["القهار","Al-Qahhar","The Subduer","Everything is under His control, even what feels unbeatable.","Quran 13:16"],
["الوهاب","Al-Wahhab","The Giver of Gifts","He gives freely and owes nothing. Every blessing you have is a gift.","Quran 3:8"],
["الرزاق","Ar-Razzaq","The Provider","Your provision is written and He is the one sending it. Work hard, then trust.","Quran 51:58"],
["الفتاح","Al-Fattah","The Opener","He opens doors, and opens hearts to the truth, when the time is right.","Quran 34:26"],
["العليم","Al-Alim","The All-Knowing","He knows what is in your heart, so be honest with Him.","Quran 2:29"],
["القابض","Al-Qabid","The Withholder","He holds back by wisdom. A tight season is not abandonment.","Quran 2:245"],
["الباسط","Al-Basit","The Expander","He expands provision, relief, and hearts whenever He wills.","Quran 2:245"],
["الخافض","Al-Khafid","The Abaser","He lowers whom He wills. No pride lasts against Him.",H],
["الرافع","Ar-Rafi","The Exalter","He raises people in rank. Be patient and humble, because elevation is His to give.",H],
["المعز","Al-Mu'izz","The Giver of Honor","Real honor comes only from Him, not from followers or status.","Quran 3:26"],
["المذل","Al-Mudhill","The Giver of Dishonor","Disgrace comes when He decrees it. Don't chase approval by disobeying Him.","Quran 3:26"],
["السميع","As-Sami","The All-Hearing","He hears every dua, even the ones you only whisper in your heart.","Quran 2:127"],
["البصير","Al-Basir","The All-Seeing","He sees what nobody else sees, including your private effort.","Quran 17:1"],
["الحكم","Al-Hakam","The Judge","His judgment is final and fair. Leave your case with Him.","Quran 6:114"],
["العدل","Al-Adl","The Utterly Just","He never wrongs anyone, not even by the weight of an atom.","Quran 4:40 (He wrongs no one)"],
["اللطيف","Al-Latif","The Subtle, The Most Gentle","He brings good to you through quiet, hidden ways you may not notice.","Quran 6:103"],
["الخبير","Al-Khabir","The All-Aware","He knows the inner reality of everything, not just what shows.","Quran 6:18"],
["الحليم","Al-Halim","The Forbearing","He doesn't rush to punish. He gives you time to return.","Quran 2:235"],
["العظيم","Al-Azim","The Magnificent","Nothing is greater than Him. Compare your problems to Him, not to yourself.","Quran 2:255"],
["الغفور","Al-Ghafur","The Great Forgiver","Forgiveness is part of who He is. No sin is too big to bring to Him.","Quran 2:173"],
["الشكور","Ash-Shakur","The Most Appreciative","He rewards small deeds greatly. Nothing sincere is wasted.","Quran 35:30"],
["العلي","Al-Ali","The Most High","He is above all things in status and power.","Quran 2:255"],
["الكبير","Al-Kabir","The Most Great","Greater than anything you can imagine or fear.","Quran 13:9"],
["الحفيظ","Al-Hafiz","The Preserver","He protects you, your faith, and the record of your deeds.","Quran 11:57"],
["المقيت","Al-Muqit","The Sustainer","He gives every living creature what it needs to survive.","Quran 4:85"],
["الحسيب","Al-Hasib","The Reckoner","He keeps perfect account, and He is enough for you.","Quran 4:6"],
["الجليل","Al-Jalil","The Majestic","His glory has no limit. Let that shape how you stand in prayer.","Quran 55:27"],
["الكريم","Al-Karim","The Most Generous","He gives beyond what you ask and never makes you feel small for asking.","Quran 82:6"],
["الرقيب","Ar-Raqib","The Watchful","He is always watching. That brings accountability, and comfort when you're alone.","Quran 5:117"],
["المجيب","Al-Mujib","The Responsive","He answers. Ask Him, because no sincere dua goes unheard.","Quran 11:61"],
["الواسع","Al-Wasi","The All-Encompassing","His mercy, knowledge, and generosity have no limit.","Quran 2:115"],
["الحكيم","Al-Hakim","The All-Wise","Everything He decrees has wisdom, even when you can't see it yet.","Quran 31:27"],
["الودود","Al-Wadud","The Most Loving","He loves His servants and shows warmth to those who return to Him.","Quran 11:90"],
["المجيد","Al-Majid","The Glorious","Glorious and generous at the same time. Worthy of all honor.","Quran 11:73"],
["الباعث","Al-Ba'ith","The Resurrector","He will raise everyone. This life is not the end.","Quran 22:7"],
["الشهيد","Ash-Shahid","The Witness","He witnesses everything you do. Nothing goes unnoticed or unrewarded.","Quran 5:117"],
["الحق","Al-Haqq","The Absolute Truth","He is the Truth, and what He says is real. Everything else fades.","Quran 22:6"],
["الوكيل","Al-Wakil","The Trustee","Do your best, then rely on Him. He handles what you can't.","Quran 3:173"],
["القوي","Al-Qawiyy","The Most Strong","His strength never tires and never needs help.","Quran 22:40"],
["المتين","Al-Matin","The Firm","Unshakably firm. His plan and His support can't be broken.","Quran 51:58"],
["الولي","Al-Waliyy","The Protecting Friend","He is close to the believers and looks after them.","Quran 42:9"],
["الحميد","Al-Hamid","The Praiseworthy","Worthy of all praise. Make gratitude a habit.","Quran 14:8"],
["المحصي","Al-Muhsi","The Accounter","He counts everything, including every good deed you've forgotten.","Quran 72:28 (He counts all things)"],
["المبدئ","Al-Mubdi","The Originator","He starts creation. Every beginning is from Him.","Quran 85:13"],
["المعيد","Al-Mu'id","The Restorer","He brings creation back after it ends. A fresh start is always possible with Him.","Quran 85:13"],
["المحيي","Al-Muhyi","The Giver of Life","He gives life, including to dead land and dead hearts.","Quran 30:50"],
["المميت","Al-Mumit","The Giver of Death","Death comes only by His decree, at the time He set.","Quran 2:258"],
["الحي","Al-Hayy","The Ever-Living","His life never ends. Ours does, so live with that in mind.","Quran 2:255"],
["القيوم","Al-Qayyum","The Self-Sustaining","He sustains everything and needs nothing. Hold on to Him, not to things.","Quran 2:255"],
["الواجد","Al-Wajid","The Finder","He lacks nothing and nothing is lost to Him.",H],
["الماجد","Al-Maajid","The Noble","Noble in majesty and generosity.",H],
["الواحد","Al-Wahid","The One","No partner, no equal. This is the heart of Islam.","Quran 2:163"],
["الأحد","Al-Ahad","The Unique","One and only, with nothing like Him.","Quran 112:1"],
["الصمد","As-Samad","The Eternal Refuge","Everyone turns to Him in need and He needs no one.","Quran 112:2"],
["القادر","Al-Qadir","The All-Capable","He can do all things. Nothing is too hard for your dua.","Quran 2:20"],
["المقتدر","Al-Muqtadir","The All-Powerful","Total power over everything, with no exceptions.","Quran 54:42"],
["المقدم","Al-Muqaddim","The Expediter","He brings forward whatever He wills, at the right moment.",H],
["المؤخر","Al-Mu'akhkhir","The Delayer","He delays by wisdom. Waiting is not the same as being denied.",H],
["الأول","Al-Awwal","The First","Before everything, with nothing before Him.","Quran 57:3"],
["الآخر","Al-Akhir","The Last","After everything, with nothing after Him.","Quran 57:3"],
["الظاهر","Az-Zahir","The Manifest","Nothing is above Him, and His signs are clear everywhere.","Quran 57:3"],
["الباطن","Al-Batin","The Hidden","Nothing is closer than Him, and He is aware of what is hidden.","Quran 57:3"],
["الوالي","Al-Wali","The Governor","He manages every affair. Nothing runs without Him.","Quran 13:11"],
["المتعالي","Al-Muta'ali","The Most Exalted","Far above anything we can describe or compare Him to.","Quran 13:9"],
["البر","Al-Barr","The Source of Goodness","Kind and good to His servants, even when they fall short.","Quran 52:28"],
["التواب","At-Tawwab","The Acceptor of Repentance","He accepts your return and also helps you return. Don't delay it.","Quran 2:37"],
["المنتقم","Al-Muntaqim","The Avenger","He holds wrongdoers to account, so justice will be done.","Quran 32:22"],
["العفو","Al-Afuw","The Pardoner","He erases sins completely. The Prophet taught this Name for Laylat al-Qadr.","Quran 4:43"],
["الرؤوف","Ar-Ra'uf","The Most Kind","Tender kindness toward His servants.","Quran 2:143"],
["مالك الملك","Malik-ul-Mulk","Master of the Kingdom","He owns all dominion and gives it to whom He wills.","Quran 3:26"],
["ذو الجلال والإكرام","Dhul-Jalali wal-Ikram","Lord of Majesty and Generosity","Majestic enough to be feared and generous enough to be loved.","Quran 55:27"],
["المقسط","Al-Muqsit","The Equitable","He establishes justice and gives each their right.",H],
["الجامع","Al-Jami","The Gatherer","He will gather everyone on the Day of Judgment.","Quran 3:9"],
["الغني","Al-Ghani","The Self-Sufficient","He needs nothing from you. Your worship benefits you, not Him.","Quran 2:267"],
["المغني","Al-Mughni","The Enricher","He makes whom He wills self-sufficient.",H],
["المانع","Al-Mani","The Preventer","He withholds what isn't good for you, even when you wanted it.",H],
["الضار","Ad-Darr","The Distresser","No harm reaches you except by His permission.",H],
["النافع","An-Nafi","The Benefactor","Real benefit comes only from Him.",H],
["النور","An-Nur","The Light","He is the source of light and guidance for hearts and skies.","Quran 24:35"],
["الهادي","Al-Hadi","The Guide","He guides hearts. Ask for guidance every single day.","Quran 25:31"],
["البديع","Al-Badi","The Incomparable Originator","He created with no model to copy.","Quran 2:117"],
["الباقي","Al-Baqi","The Everlasting","Everything fades except Him.","Quran 55:27"],
["الوارث","Al-Warith","The Inheritor","Everything returns to Him in the end.","Quran 15:23"],
["الرشيد","Ar-Rashid","The Guide to the Right Path","His guidance is perfectly timed and always leads to what is right.",H],
["الصبور","As-Sabur","The Patient","Perfect patience. He gives time and never acts out of anger.",H]
];
/* Names scholars teach to mention together with their opposite (index pairs, 0-based) */
const PAIRS = [[19,20],[21,22],[23,24],[70,71],[57,58],[59,60],[90,91]];
const pairOf = i => { for (const [a,b] of PAIRS){ if(a===i) return b; if(b===i) return a; } return null; };

/* ---------- State ---------- */
const KEY = "asma_v1";
let S = { learned: [], last: "", streak: 0, best: 0 };
const mem = {};
const store = {
  get(){ try { return localStorage.getItem(KEY); } catch(e){ return mem[KEY] || null; } },
  set(v){ try { localStorage.setItem(KEY, v); } catch(e){ mem[KEY] = v; } }
};
try { const raw = store.get(); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
const save = () => store.set(JSON.stringify(S));
const dkey = d => d.toLocaleDateString("en-CA");
(function visit(){
  const now = new Date(), t = dkey(now);
  if (S.last === t) return;
  const y = new Date(now); y.setDate(y.getDate()-1);
  S.streak = (S.last === dkey(y)) ? S.streak + 1 : 1;
  S.last = t; save();
})();
const isLearned = i => S.learned.includes(i);
const toggleLearned = i => { S.learned = isLearned(i) ? S.learned.filter(x=>x!==i) : [...S.learned, i]; save(); };
const todayIndex = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000) % N.length; };

/* ---------- UI helpers ---------- */
const $ = s => document.querySelector(s);
const view = $("#view");
let tab = "today";
function chip(){ $("#streakChip").textContent = "🔥 " + S.streak + (S.streak === 1 ? " day" : " days"); }

function referenceMarkup(ref){
  if (ref.startsWith("Jami at-Tirmidhi 3507")) {
    return `<a href="https://sunnah.com/tirmidhi/48/138" target="_blank" rel="noopener noreferrer" aria-label="Open Jami at-Tirmidhi hadith 3507">${ref} · Read hadith</a>`;
  }
  const match = /^Quran\s+(\d{1,3}):(\d{1,3})/.exec(ref);
  if (!match) return ref;
  const surah = Number(match[1]), ayah = Number(match[2]);
  if (surah < 1 || surah > 114 || ayah < 1) return ref;
  const url = `https://quran.com/${surah}/${ayah}`;
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" aria-label="Open Qur’an ${surah}, verse ${ayah} on Quran.com">${ref} · Read in Qur’an</a>`;
}

function nameBlock(i){
  const [ar,tr,en,lesson,ref] = N[i], p = pairOf(i);
  return `
    <section class="hero">
      <div class="ar" lang="ar">${ar}</div>
      <div class="tr">${tr}</div>
      <div class="en">${en}</div>
    </section>
    <div class="lesson">${lesson}
      <div class="ref">${referenceMarkup(ref)}</div>
      ${p!==null ? `<div class="pair">Scholars often teach to mention this Name together with its pair, ${N[p][1]}.</div>` : ""}
    </div>
    <div class="row">
      <button class="btn" data-learn="${i}" aria-pressed="${isLearned(i)}">${isLearned(i) ? "Learned ✓" : "Mark as learned"}</button>
      <button class="btn ghost" data-share="${i}">Share</button>
    </div>`;
}

/* ---------- Views ---------- */
function renderToday(){
  const i = todayIndex(), n = S.learned.length, pct = Math.round(n/N.length*100);
  view.innerHTML = nameBlock(i) + `
    <div class="progress">
      <b>${n} of 99 learned</b>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="99" aria-valuenow="${n}"><i style="width:${pct}%"></i></div>
      <span class="muted" style="font-size:14px">Come back tomorrow for a new Name.</span>
    </div>
    <p class="dua">Allah says to call upon Him by His beautiful Names (<a class="quran-ref" href="https://quran.com/7/180" target="_blank" rel="noopener noreferrer">Qur’an 7:180 · Read in Qur’an</a>).</p>`;
}

let query = "";
function renderLibrary(){
  view.innerHTML = `
    <input class="search" id="q" type="search" placeholder="Search by name or meaning" value="${query}" aria-label="Search the 99 Names">
    <div class="list" id="list"></div>`;
  const input = $("#q");
  input.addEventListener("input", () => { query = input.value; drawList(); });
  drawList();
}
function drawList(){
  const q = query.trim().toLowerCase();
  const rows = N.map((n,i)=>({n,i})).filter(({n}) =>
    !q || n[1].toLowerCase().includes(q) || n[2].toLowerCase().includes(q) || n[0].includes(q) ||
    n[1].toLowerCase().replace(/[-']/g,"").includes(q.replace(/[-']/g,"")));
  $("#list").innerHTML = rows.length ? rows.map(({n,i}) => `
    <button class="item" data-open="${i}">
      <span class="ar" lang="ar">${n[0]}</span>
      <span class="t"><b>${n[1]}</b><span>${n[2]}</span></span>
      ${isLearned(i) ? '<span class="dot" title="Learned"></span>' : ""}
    </button>`).join("") : `<p class="empty">No Name matches “${q.replace(/</g,"&lt;")}”.</p>`;
}

/* ---------- Quiz ---------- */
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let Q = null;
function newQuiz(){
  const ids = shuffle([...N.keys()]).slice(0,10);
  Q = { qs: ids.map(makeQ), pos: 0, score: 0, run: 0, bestRun: 0, answered: false, done: false };
}
function makeQ(i){
  const type = Math.floor(Math.random()*3);
  const field = type === 0 ? 1 : type === 1 ? 2 : 0;     // option text field
  const correct = N[i][field];
  const others = shuffle([...N.keys()].filter(j => j!==i && N[j][field]!==correct)).slice(0,3).map(j => N[j][field]);
  return { i, type, field, options: shuffle([correct, ...others]), correct };
}
function renderQuiz(){
  if (!Q) {
    view.innerHTML = `
      <div class="card center">
        <h2 style="margin-bottom:6px">Quiz</h2>
        <p class="q-prompt">10 questions. Build a streak.</p>
        <p class="muted" style="margin-bottom:18px">Your best streak: ${S.best}</p>
        <button class="btn block" id="start">Start quiz</button>
      </div>`;
    $("#start").onclick = () => { newQuiz(); renderQuiz(); };
    return;
  }
  if (Q.done) {
    view.innerHTML = `
      <div class="card center">
        <h2>Round complete</h2>
        <div class="score">${Q.score}/${Q.qs.length}</div>
        <p>Best streak this round: <b>${Q.bestRun}</b></p>
        <p class="muted" style="margin:4px 0 18px">All-time best streak: ${S.best}</p>
        <div class="row" style="justify-content:center">
          <button class="btn" id="again">Play again</button>
          <button class="btn ghost" id="exit">Back to Today</button>
        </div>
      </div>`;
    $("#again").onclick = () => { newQuiz(); renderQuiz(); };
    $("#exit").onclick = () => { Q = null; go("today"); };
    return;
  }
  const q = Q.qs[Q.pos], [ar,tr,en] = N[q.i];
  const prompt = q.type === 0 ? `Which Name means “${en}”?` :
                 q.type === 1 ? "What does this Name mean?" : `Which one is ${tr}?`;
  const big = q.type === 1 ? `<div class="q-big ar" lang="ar">${ar}</div>` : "";
  view.innerHTML = `
    <div class="card">
      <div class="q-meta"><span>Question ${Q.pos+1} of ${Q.qs.length}</span><span>Streak ${Q.run}</span></div>
      <p class="q-prompt">${prompt}</p>
      ${big}
      <div class="opts">
        ${q.options.map((o,k)=>`<button class="opt ${q.field===0?"ar":""}" ${q.field===0?'lang="ar"':""} data-k="${k}">${o}</button>`).join("")}
      </div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
}
function answer(k){
  if (Q.answered) return;
  Q.answered = true;
  const q = Q.qs[Q.pos], picked = q.options[k], ok = picked === q.correct;
  if (ok){ Q.score++; Q.run++; Q.bestRun = Math.max(Q.bestRun, Q.run); if (Q.run > S.best){ S.best = Q.run; save(); } }
  else Q.run = 0;
  document.querySelectorAll(".opt").forEach((b,idx) => {
    b.disabled = true;
    if (q.options[idx] === q.correct) b.classList.add("good");
    else if (idx === k) b.classList.add("bad");
  });
  const [ar,tr,en,lesson] = N[q.i];
  $("#fb").innerHTML = `
    <p><b class="${ok?"good":"bad"}">${ok ? "Correct" : "Not quite"}</b>. ${tr}: ${en}.</p>
    <p class="muted" style="margin:6px 0 14px">${lesson}</p>
    <button class="btn block" id="next">${Q.pos === Q.qs.length-1 ? "See results" : "Next question"}</button>`;
  $("#next").onclick = () => {
    Q.answered = false;
    if (Q.pos === Q.qs.length-1) Q.done = true; else Q.pos++;
    renderQuiz();
  };
  $("#next").focus();
}

/* ---------- Navigation & events ---------- */
function go(t){
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ({today:renderToday, library:renderLibrary, quiz:renderQuiz})[t]();
  chip(); window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.tab));

const sheet = $("#sheet");
function openSheet(i){
  $("#sheetBody").innerHTML = `<button class="x" id="closeSheet" aria-label="Close">✕</button>` + nameBlock(i);
  $("#closeSheet").onclick = () => sheet.close();
  sheet.showModal();
}
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
sheet.addEventListener("close", () => { if (tab === "library") drawList(); if (tab === "today") renderToday(); });

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-open],[data-learn],[data-share]");
  if (!t) return;
  if (t.dataset.open !== undefined) return openSheet(+t.dataset.open);
  if (t.dataset.learn !== undefined){
    const i = +t.dataset.learn; toggleLearned(i);
    t.setAttribute("aria-pressed", isLearned(i)); t.textContent = isLearned(i) ? "Learned ✓" : "Mark as learned";
    if (!sheet.open && tab === "today") renderToday();
    return;
  }
  if (t.dataset.share !== undefined){
    const [ar,tr,en,lesson] = N[+t.dataset.share];
    const text = `${ar} – ${tr}: ${en}\n${lesson}`;
    try { if (navigator.share) await navigator.share({ title: tr, text }); else { await navigator.clipboard.writeText(text); t.textContent = "Copied"; } } catch(_){}
  }
});

go("today");
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
